<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>omapeko PWA</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
:root{
  --bg:#000;
  --accent:#00e5ff;
}
html,body{
  margin:0;
  width:100%;
  height:100%;
  background:var(--bg);
  color:#fff;
  font-family: system-ui,-apple-system;
}
body{
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  overflow:hidden;
}

button{
  margin-top:16px;
  background:none;
  border:2px solid var(--accent);
  color:var(--accent);
  padding:14px 32px;
  font-size:16px;
  border-radius:999px;
}

.hidden{display:none;}

/* 演出 */
.ripple{
  position:absolute;
  width:20px;
  height:20px;
  border-radius:50%;
  background:rgba(0,229,255,.25);
  animation:ripple .8s ease-out forwards;
}
@keyframes ripple{
  to{transform:scale(40);opacity:0;}
}
</style>
</head>
<body>

<!-- iPhone Safari -->
<div id="iosSafari" class="hidden">
  <h1>ホーム画面に追加してね</h1>
  <p>共有 → ホーム画面に追加</p>
</div>

<!-- iPhone Chrome -->
<div id="iosChrome" class="hidden">
  <h1>Safariで開いてね</h1>
  <p>Safariからならアプリ化できます</p>
  <button id="copyUrl">URLをコピー</button>
</div>

<!-- 本編（PWA / Android / PC） -->
<div id="app" class="hidden">
  <h1>omapeko App</h1>
  <p id="status">READY</p>
  <button id="tap">TAP</button>
</div>

<script>
const ua = navigator.userAgent;
const isIOS = /iPhone|iPad|iPod/.test(ua);
const isSafari = /^((?!chrome|crios|fxios).)*safari/i.test(ua);
const isStandalone =
  window.matchMedia('(display-mode: standalone)').matches ||
  window.navigator.standalone === true;

const iosSafari = document.getElementById("iosSafari");
const iosChrome = document.getElementById("iosChrome");
const app = document.getElementById("app");

// ===== 分岐 =====
if (isStandalone) {
  app.classList.remove("hidden");
} else if (isIOS && isSafari) {
  iosSafari.classList.remove("hidden");
} else if (isIOS && !isSafari) {
  iosChrome.classList.remove("hidden");
} else {
  app.classList.remove("hidden");
}

// ===== 演出 =====
const tap = document.getElementById("tap");
const status = document.getElementById("status");

tap.addEventListener("click",(e)=>{
  console.log("TAP clicked"); // ← デバッグ用

  navigator.vibrate?.(40);

  const r = document.createElement("div");
  r.className = "ripple";
  r.style.left = e.clientX + "px";
  r.style.top = e.clientY + "px";
  document.body.appendChild(r);

  setTimeout(()=>r.remove(),800);

  status.textContent = "ACTIVE";
});

// ===== URLコピー =====
const copyBtn = document.getElementById("copyUrl");
copyBtn?.addEventListener("click",()=>{
  navigator.clipboard.writeText(location.href);
  alert("Safariで貼り付けて開いてください");
});
</script>


</body>
</html>
