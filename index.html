<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>omapeko PWA</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
:root{
  --bg:#000;
  --accent:#00e5ff;
}
html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:var(--bg);
  color:#fff;
  font-family: system-ui, -apple-system, BlinkMacSystemFont;
}
body{
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  overflow:hidden;
}

h1{margin-bottom:10px;}
p{opacity:.85}

/* ボタン */
button{
  margin-top:20px;
  background:none;
  border:2px solid var(--accent);
  color:var(--accent);
  padding:16px 36px;
  font-size:18px;
  border-radius:999px;
  cursor:pointer;
  transition:.25s;
}
button:active{
  transform:scale(.95);
}

/* 波紋 */
.ripple{
  position:absolute;
  width:20px;
  height:20px;
  border-radius:50%;
  background:rgba(0,229,255,.25);
  animation:ripple 0.8s ease-out forwards;
  pointer-events:none;
}
@keyframes ripple{
  to{
    transform:scale(40);
    opacity:0;
  }
}

/* グリッチ */
.glitch{
  animation:glitch .4s linear;
}
@keyframes glitch{
  0%{transform:translateX(0)}
  25%{transform:translateX(-2px)}
  50%{transform:translateX(2px)}
  75%{transform:translateX(-1px)}
  100%{transform:none}
}

/* ロード */
.loading{
  opacity:.6;
  pointer-events:none;
}

/* 非表示 */
.hidden{display:none;}
</style>
</head>
<body>

<div id="main">
  <h1 id="title">omapeko App</h1>
  <p id="status">READY</p>
  <button id="action">TAP</button>
</div>

<script>
const action = document.getElementById("action");
const status = document.getElementById("status");
const title = document.getElementById("title");

// 波紋生成
function ripple(x,y){
  const r = document.createElement("div");
  r.className = "ripple";
  r.style.left = x+"px";
  r.style.top = y+"px";
  document.body.appendChild(r);
  setTimeout(()=>r.remove(),800);
}

action.addEventListener("click",(e)=>{
  // バイブ（対応端末）
  navigator.vibrate?.(40);

  // 波紋
  ripple(e.clientX,e.clientY);

  // ボタンロック
  action.classList.add("loading");
  action.textContent = "LOADING...";

  // グリッチ
  status.classList.add("glitch");
  title.classList.add("glitch");

  status.textContent = "RUNNING...";
  document.documentElement.style.setProperty("--bg","#05070c");

  setTimeout(()=>{
    status.textContent = "ACTIVE";
    action.textContent = "DONE";
    action.classList.remove("loading");
  },700);
});
</script>

</body>
</html>
