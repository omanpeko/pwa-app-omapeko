<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>omapeko PWA</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">

<!-- iOS -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
:root{
  --bg:#000;
  --accent:#00e5ff;
}
html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:var(--bg);
  color:#fff;
  font-family: system-ui, -apple-system, BlinkMacSystemFont;
}
body{
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}

/* 共通UI */
h1{margin-bottom:12px;}
p{opacity:.85;}
button{
  margin-top:16px;
  background:none;
  border:2px solid var(--accent);
  color:var(--accent);
  padding:14px 28px;
  font-size:16px;
  border-radius:999px;
  cursor:pointer;
  transition:.2s;
}
button:active{
  transform:scale(.95);
  background:var(--accent);
  color:#000;
}

/* フェード */
.fade{
  animation:fade .4s ease;
}
@keyframes fade{
  from{opacity:0; transform:translateY(10px);}
  to{opacity:1; transform:none;}
}

/* 非表示 */
.hidden{display:none;}
</style>
</head>
<body>

<!-- iPhone Chrome用 -->
<div id="iosChrome" class="hidden">
  <h1>Safariで開いてね</h1>
  <p>
    iPhoneではSafariから開くと<br>
    アプリとして全画面で使えます📱
  </p>
  <button id="copyUrl">URLをコピー</button>
</div>

<!-- Safari / Android / PC 共通 -->
<div id="main" class="hidden">
  <h1 id="title">omapeko App</h1>
  <p id="status">READY</p>
  <button id="action">TAP</button>
</div>

<script>
// ===== 判定 =====
const ua = navigator.userAgent;
const isIOS = /iPhone|iPad|iPod/.test(ua);
const isSafari = /^((?!chrome|crios|fxios).)*safari/i.test(ua);
const isStandalone =
  window.matchMedia('(display-mode: standalone)').matches ||
  window.navigator.standalone === true;

// ===== 表示制御 =====
const iosChrome = document.getElementById("iosChrome");
const main = document.getElementById("main");

if(isIOS && !isSafari && !isStandalone){
  // iPhone Chrome
  iosChrome.classList.remove("hidden");
}else{
  // Safari / Android / PC / PWA
  main.classList.remove("hidden");
}

// ===== ボタン動作 =====
const action = document.getElementById("action");
const status = document.getElementById("status");

action?.addEventListener("click",()=>{
  status.textContent = "RUNNING...";
  status.classList.add("fade");
  document.documentElement.style.setProperty("--bg","#05070c");

  setTimeout(()=>{
    status.textContent = "TAP AGAIN";
  },600);
});

// ===== URLコピー =====
document.getElementById("copyUrl")?.addEventListener("click",()=>{
  navigator.clipboard.writeText(location.href);
  alert("URLをコピーしました。\nSafariで貼り付けて開いてください。");
});
</script>

</body>
</html>
